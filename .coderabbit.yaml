# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR
early_access: true

reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!**/*.xml"
    - "!**/*.lock"
  path_instructions:
    - path: "apps/web/**"
      instructions: |
        Next.js 14 App Router 기반 프론트엔드입니다.
        - Server Components 우선 사용
        - shadcn/ui 컴포넌트 활용
        - Tailwind CSS 클래스 사용 (인라인 스타일 금지)
    - path: "apps/api/**"
      instructions: |
        NestJS 백엔드입니다.
        - 모듈별 폴더 구조 유지
        - DTO에 class-validator 사용
        - NestJS 내장 예외 클래스 사용
    - path: "packages/**"
      instructions: |
        공유 패키지입니다.
        - ui: 공유 UI 컴포넌트
        - config: 공유 설정
        - types: 공유 타입 정의
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    drafts: false
    base_branches:
      - release
      - development
      - "feat/*"
      - "hotfix/*"

chat:
  auto_reply: true
